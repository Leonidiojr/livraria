# Perfil de testes: banco PostgreSQL separado para nao interferir nos dados de desenvolvimento.
# Crie uma vez com: psql -U livraria -d livraria -c "CREATE DATABASE livraria_test OWNER livraria"
spring.datasource.url=${TEST_DB_URL:jdbc:postgresql://localhost:5432/livraria_test}
spring.datasource.username=${DB_USERNAME:livraria}
spring.datasource.password=${DB_PASSWORD:livraria_dev}
spring.devtools.restart.enabled=false
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN

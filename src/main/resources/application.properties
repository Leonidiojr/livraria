spring.application.name=livraria

# Banco de dados (PostgreSQL)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/livraria}
spring.datasource.username=${DB_USERNAME:livraria}
spring.datasource.password=${DB_PASSWORD:livraria_dev}

# JPA / Hibernate: o esquema e gerenciado pelo Flyway, o Hibernate apenas valida
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=livraria

# Flyway
spring.flyway.schemas=livraria
spring.flyway.default-schema=livraria
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# JWT (troque o segredo em producao: base64 de no minimo 32 bytes)
app.jwt.secret=${JWT_SECRET:bGl2cmFyaWEtZGV2LXNlZ3JlZG8tand0LTMyLWJ5dGVzLW1pbmltby0xMjM0NTY=}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:120}

# Usuario administrador criado na primeira inicializacao
app.admin.email=${ADMIN_EMAIL:admin@livraria.com}
app.admin.password=${ADMIN_PASSWORD:admin123}

# Swagger
springdoc.swagger-ui.path=/swagger-ui.html

# Upload de imagens (capa do livro e foto do autor)
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB

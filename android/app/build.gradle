plugins {
    id 'com.android.application'
}

android {
    namespace = 'com.example.livraria.android'
    compileSdk = 37

    defaultConfig {
        applicationId = 'com.example.livraria.android'
        minSdk = 24
        targetSdk = 37
        versionCode = 1
        versionName = '1.0'

        // Endereco padrao da API. 10.0.2.2 e o "localhost" do computador visto pelo emulador.
        // Pode ser alterado na tela de login (icone de engrenagem).
        buildConfigField 'String', 'API_URL_PADRAO', '"http://10.0.2.2:8080/"'
    }

    buildFeatures {
        buildConfig = true
        viewBinding = true
    }

    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.fragment:fragment:1.8.5'

    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.11.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.github.bumptech.glide:glide:4.16.0'
}
